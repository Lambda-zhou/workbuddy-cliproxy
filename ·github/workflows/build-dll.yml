name: Build workbuddy.dll

on:
  workflow_dispatch:        # 手动触发：仓库 Actions 页面点 Run workflow
  push:
    tags: [ 'v*' ]          # 或打 tag 触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Setup MinGW (gcc)
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Build DLL (amd64)
        shell: bash
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            go build -buildmode=c-shared -ldflags "-s -w" \
            -o workbuddy.dll .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-windows-amd64
          path: workbuddy.dll
          if-no-files-found: error
