name: Build workbuddy.dll

on:
  workflow_dispatch:        # 手动触发：仓库 Actions 页面点 Run workflow
  push:
    tags: [ 'v*' ]          # 或打 tag 触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # 不用 egor-tensin/setup-mingw@v2：它在 mingw 16.1.0 上会因找不到
      # libpthread.dll.a 报错(action 未适配新版 mingw)。直接在 runner 自带的
      # Chocolatey 里装 mingw，并把 bin 目录追加到 PATH。
      - name: Install MinGW (choco)
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify gcc
        shell: bash
        run: gcc --version

      - name: Build DLL (amd64)
        shell: bash
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            go build -buildmode=c-shared -ldflags "-s -w" \
            -o workbuddy.dll .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-windows-amd64
          path: workbuddy.dll
          if-no-files-found: error
